<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.35" stop-color="#e8b94a"/>
      <stop offset="0.65" stop-color="#a9741f"/>
      <stop offset="1" stop-color="#f3cf6a"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5d17"/>
      <stop offset="1" stop-color="#3d2606"/>
    </linearGradient>
    <radialGradient id="sea" cx="0.45" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#3c86c9"/>
      <stop offset="0.55" stop-color="#1a4f8f"/>
      <stop offset="1" stop-color="#0a2148"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bfe6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bfe6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb3d9" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5b8fbf" stop-opacity="0.22"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="186"/></clipPath>
  </defs>

  <!-- outer gold rim -->
  <circle cx="256" cy="256" r="246" fill="url(#goldDark)"/>
  <circle cx="256" cy="256" r="240" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="226" fill="url(#goldDark)"/>
  <circle cx="256" cy="256" r="220" fill="#12294d"/>
  <!-- rune band: small notches round the ring -->
  <g stroke="#e8b94a" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <circle cx="256" cy="256" r="204" fill="none" stroke-dasharray="2 14"/>
  </g>
  <circle cx="256" cy="256" r="194" fill="url(#gold)"/>

  <!-- the sea and a faint map -->
  <g clip-path="url(#disc)">
    <circle cx="256" cy="256" r="186" fill="url(#sea)"/>
    <g fill="none" stroke="#9fd0f5" stroke-opacity="0.16" stroke-width="1.5">
      <path d="M70 160 H442 M70 210 H442 M70 260 H442 M70 310 H442 M70 360 H442"/>
      <path d="M150 70 V442 M200 70 V442 M250 70 V442 M300 70 V442 M350 70 V442"/>
    </g>
    <!-- two continents, loosely -->
    <path fill="url(#land)" stroke="#bfe0fa" stroke-opacity="0.35" stroke-width="2"
          d="M98 150 C130 118 176 126 190 160 C204 196 176 214 186 250 C196 288 168 330 140 352
             C118 368 92 340 96 308 C100 276 80 258 84 226 C88 196 74 176 98 150 Z"/>
    <path fill="url(#land)" stroke="#bfe0fa" stroke-opacity="0.35" stroke-width="2"
          d="M318 118 C352 104 396 120 404 156 C412 190 388 204 398 236 C410 276 392 318 360 338
             C330 356 300 340 304 306 C308 276 286 262 292 228 C298 196 284 134 318 118 Z"/>
    <circle cx="256" cy="256" r="150" fill="url(#glow)"/>
    <!-- the route: dotted path from a start point to a pin -->
    <path d="M126 330 C170 300 190 360 236 330 S300 220 352 196" fill="none"
          stroke="#fff3c4" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 15"/>
    <circle cx="126" cy="330" r="9" fill="#fff3c4" stroke="#7a4f12" stroke-width="3"/>
  </g>

  <!-- compass rose -->
  <g transform="translate(256 256)">
    <g opacity="0.9">
      <path d="M0 -150 L14 -14 L0 0 Z M0 150 L-14 14 L0 0 Z M-150 0 L-14 -14 L0 0 Z M150 0 L14 14 L0 0 Z" fill="#f3cf6a"/>
      <path d="M0 -150 L-14 -14 L0 0 Z M0 150 L14 14 L0 0 Z M-150 0 L-14 14 L0 0 Z M150 0 L14 -14 L0 0 Z" fill="#8a5d17"/>
    </g>
    <g transform="rotate(45)" opacity="0.75">
      <path d="M0 -88 L9 -9 L0 0 Z M0 88 L-9 9 L0 0 Z M-88 0 L-9 -9 L0 0 Z M88 0 L9 9 L0 0 Z" fill="#e6eef7"/>
      <path d="M0 -88 L-9 -9 L0 0 Z M0 88 L9 9 L0 0 Z M-88 0 L-9 9 L0 0 Z M88 0 L9 -9 L0 0 Z" fill="#8ea6c0"/>
    </g>
    <circle r="16" fill="url(#gold)" stroke="#5a3a0c" stroke-width="3"/>
    <circle r="6" fill="#12294d"/>
  </g>

  <!-- destination pin -->
  <g transform="translate(352 196)">
    <path d="M0 0 C-6 -14 -24 -26 -24 -46 A24 24 0 0 1 24 -46 C24 -26 6 -14 0 0 Z"
          fill="url(#gold)" stroke="#4a2f08" stroke-width="4"/>
    <circle cy="-46" r="9" fill="#12294d"/>
  </g>

  <!-- N gem on the rim -->
  <g transform="translate(256 18)">
    <path d="M0 -12 L14 6 L0 22 L-14 6 Z" fill="#7fd3ff" stroke="#5a3a0c" stroke-width="3"/>
    <path d="M0 -12 L6 6 L0 22 Z" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>
